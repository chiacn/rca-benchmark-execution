name: Model comparison encrypted incident backend
on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        type: choice
        options:
          - gpt-5.6-sol
          - gpt-5.6-terra
      session:
        required: true
        type: string
      request_branch:
        required: true
        type: string
      response_branch:
        required: true
        type: string
      report_session:
        required: true
        type: string
      report_recipient:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.7.22 cryptography==46.0.5
      - name: Verify pinned upstream binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python upstream_artifact_probe.py
      - name: Install frozen benchmark environment
        run: |
          git clone --filter=blob:none https://github.com/GreptimeTeam/agent-rca-bench.git "$RUNNER_TEMP/benchmark"
          git -C "$RUNNER_TEMP/benchmark" checkout --detach fdfbca65c87c36c6b06bddfa6d611544f13bfa34
          cd "$RUNNER_TEMP/benchmark"
          uv sync --extra dev --frozen
          uv pip install cryptography==46.0.5
      - name: Test native bridge against pinned source
        run: |
          cd "$RUNNER_TEMP/benchmark"
          uv run python -m unittest discover -s "$GITHUB_WORKSPACE" -p test_persistent_raw_mailbox.py
          uv run python "$GITHUB_WORKSPACE/replay_native_official_scorer.py" --benchmark-repo "$RUNNER_TEMP/benchmark"
      - name: Run intact live preparation and encrypted official tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RCA_SESSION: ${{ inputs.session }}
          RCA_REQUEST_BRANCH: ${{ inputs.request_branch }}
          RCA_RESPONSE_BRANCH: ${{ inputs.response_branch }}
        run: |
          cd "$RUNNER_TEMP/benchmark"
          uv run python "$GITHUB_WORKSPACE/persistent_raw_mailbox.py" --benchmark-repo "$RUNNER_TEMP/benchmark" --bins-tar "$RUNNER_TEMP/pinned-greptime-artifact/bins.tar.gz" --operator-root "$RUNNER_TEMP/rca-live-backend" --repo "$GITHUB_REPOSITORY" --request-branch "$RCA_REQUEST_BRANCH" --response-branch "$RCA_RESPONSE_BRANCH" --session "$RCA_SESSION" --model "${{ inputs.model }}" --effort high --max-seconds 7800
      - name: Encrypt private backend reports
        if: always()
        env:
          RCA_REPORT_SESSION: ${{ inputs.report_session }}
          RCA_REPORT_RECIPIENT: ${{ inputs.report_recipient }}
          RCA_OPERATOR_ROOT_NAME: rca-live-backend
        run: python encrypt_preflight_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: encrypted-native-backend-reports
          path: encrypted_backend_reports.json
          retention-days: 1
          if-no-files-found: warn
