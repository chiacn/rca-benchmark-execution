name: Encrypted RCA relay smoke
on:
  workflow_dispatch:
    inputs:
      session:
        required: true
        type: string
      request_branch:
        required: true
        type: string
      response_branch:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography==46.0.5
      - name: Verify pinned upstream binary access and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python upstream_artifact_probe.py
      - name: Run operator-only encrypted relay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RCA_SESSION: ${{ inputs.session }}
          RCA_REQUEST_BRANCH: ${{ inputs.request_branch }}
          RCA_RESPONSE_BRANCH: ${{ inputs.response_branch }}
        run: >-
          python mailbox_runner.py
          --repo "$GITHUB_REPOSITORY"
          --request-branch "$RCA_REQUEST_BRANCH"
          --response-branch "$RCA_RESPONSE_BRANCH"
          --session "$RCA_SESSION"
          --max-seconds 900
          --trace "$RUNNER_TEMP/relay-trace.jsonl"
